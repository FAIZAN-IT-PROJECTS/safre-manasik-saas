# Root-level Railway monorepo config.
# Railway auto-detects services from /backend and /frontend dirs.

[build]
# Each service builds with NIXPACKS (see backend/railway.json + railway.toml,
# frontend/railway.json). The Dockerfiles are a local/fallback path only.

[[services]]
name = "backend"
source = "backend"

[[services]]
name = "frontend"
source = "frontend"
